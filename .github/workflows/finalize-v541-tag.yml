name: Finalize clean v5.4.1 tag

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v541-tag.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-remove, retag clean release, and remove verification branch
        run: |
          set -euxo pipefail
          test "$(sed -n 's/^version:[[:space:]]*//p' SKILL.md | head -1)" = "5.4.1"
          git config user.name "AHP release finalizer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-v541-tag.yml
          git commit -m "chore: remove v5.4.1 release finalizer"
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          git tag -f v5.4.1 "$FINAL_SHA"
          git push --force origin refs/tags/v5.4.1
          if git ls-remote --exit-code --heads origin refs/heads/v5.4.1-final-verification >/dev/null 2>&1; then
            git push origin --delete v5.4.1-final-verification
          fi
          echo "FINAL_V541_SHA=$FINAL_SHA"
