name: Apply v5.4.1 final hardening

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/apply-v541-final-hardening.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.4.1-hardening
          fetch-depth: 0

      - name: Apply final hardening and startup integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} matches, got {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def insert_before(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if block.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f'{path}: marker missing')
              p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          # README: installation is not enough. AHP must be explicitly loaded by
          # the user's startup procedure at the beginning of every Hermes session.
          old_install = '''Place the skill directory at:

```text
~/.hermes/skills/software-development/anti-hallucination-protocol/
```

Then start a new Hermes session and verify discovery using the currently available Hermes skill tooling.
'''
          new_install = '''Place the skill directory at:

```text
~/.hermes/skills/software-development/anti-hallucination-protocol/
```

### Mandatory startup integration

Installing the files is **not** the same thing as activating the protocol for a session. Add Anti-Hallucination Protocol to the startup/boot procedure that runs at the beginning of **every Hermes session**, before ordinary task work begins.

If your workspace uses a `/start` skill or equivalent boot skill, edit that procedure so its minimal boot explicitly loads:

```text
skill_view(name="anti-hallucination-protocol")
```

A healthy boot should visibly include a successful skill load comparable to:

```text
📚 skill  anti-hallucination-protocol
```

Load AHP alongside other baseline session controls such as identity/memory and anti-sycophancy policy. Do not rely on the skill merely existing under `~/.hermes/skills/`; if the startup log does not show that it was loaded, treat it as **installed but not active for startup**.

After wiring the startup procedure, start a completely new Hermes session and verify that AHP is loaded during boot. The exact surrounding boot sequence is workspace-specific; the invariant is that `anti-hallucination-protocol` is explicitly loaded before consequential work starts.
'''
          replace_once('README.md', old_install, new_install)

          # Verifier: reject whitespace-only match terms too, not only the empty
          # string, and avoid retaining unbounded subprocess output in RAM.
          replace_once('scripts/verify_claim.py', 'import sys\nfrom pathlib import Path', 'import sys\nimport tempfile\nfrom pathlib import Path')
          replace_once('scripts/verify_claim.py', 'if args.pattern == "":\n        fail("file-contains pattern must not be empty")', 'if not args.pattern.strip():\n        fail("file-contains pattern must not be empty or whitespace-only")')
          replace_once('scripts/verify_claim.py', 'if args.expected == "":\n        fail("file-line expected text must not be empty")', 'if not args.expected.strip():\n        fail("file-line expected text must not be empty or whitespace-only")')
          replace_once('scripts/verify_claim.py', 'if args.expected == "":\n        fail("--expected must not be empty")', 'if not args.expected.strip():\n        fail("--expected must not be empty or whitespace-only")')

          old_capture = '''    try:
        completed = subprocess.run(
            command,
            capture_output=True,
            text=False,
            timeout=args.timeout,
            check=False,
        )
    except subprocess.TimeoutExpired as exc:
        emit(
            "ERROR",
            claim="command output contains expected text",
            evidence={"command": command, "timeout_seconds": args.timeout},
            detail=f"command exceeded timeout: {exc}",
        )
        return ERROR
    except (OSError, subprocess.SubprocessError) as exc:
        emit(
            "ERROR",
            claim="command output contains expected text",
            evidence={"command": command},
            detail=f"command could not be executed: {exc}",
        )
        return ERROR

    stdout_bytes = completed.stdout or b""
    stderr_bytes = completed.stderr or b""
    total_bytes = len(stdout_bytes) + len(stderr_bytes)
    if total_bytes > args.max_output_bytes:
        emit(
            "ERROR",
            claim="command output contains expected text",
            evidence={
                "command": command,
                "returncode": completed.returncode,
                "captured_output_bytes": total_bytes,
                "max_output_bytes": args.max_output_bytes,
            },
            detail="captured output exceeded verifier limit; output was not accepted as evidence",
        )
        return ERROR
'''
          new_capture = '''    try:
        # Spool command output to temporary files so --max-output-bytes limits
        # evidentiary acceptance without requiring unbounded in-memory capture.
        with tempfile.TemporaryFile() as stdout_file, tempfile.TemporaryFile() as stderr_file:
            completed = subprocess.run(
                command,
                stdout=stdout_file,
                stderr=stderr_file,
                text=False,
                timeout=args.timeout,
                check=False,
            )
            stdout_size = stdout_file.tell()
            stderr_size = stderr_file.tell()
            total_bytes = stdout_size + stderr_size
            if total_bytes > args.max_output_bytes:
                emit(
                    "ERROR",
                    claim="command output contains expected text",
                    evidence={
                        "command": command,
                        "returncode": completed.returncode,
                        "stdout_bytes": stdout_size,
                        "stderr_bytes": stderr_size,
                        "captured_output_bytes": total_bytes,
                        "max_output_bytes": args.max_output_bytes,
                    },
                    detail="captured output exceeded verifier limit; output was not accepted as evidence",
                )
                return ERROR
            stdout_file.seek(0)
            stderr_file.seek(0)
            stdout_bytes = stdout_file.read()
            stderr_bytes = stderr_file.read()
    except subprocess.TimeoutExpired as exc:
        emit(
            "ERROR",
            claim="command output contains expected text",
            evidence={"command": command, "timeout_seconds": args.timeout},
            detail=f"command exceeded timeout: {exc}",
        )
        return ERROR
    except (OSError, subprocess.SubprocessError) as exc:
        emit(
            "ERROR",
            claim="command output contains expected text",
            evidence={"command": command},
            detail=f"command could not be executed: {exc}",
        )
        return ERROR
'''
          replace_once('scripts/verify_claim.py', old_capture, new_capture)

          # Integrity: quoted top-level keys must participate in duplicate-key
          # detection too.
          replace_once(
              'scripts/check_v5_integrity.py',
              'TOP_LEVEL_KEY_RE = re.compile(r"^(?P<key>[A-Za-z_][A-Za-z0-9_-]*):", re.MULTILINE)',
              'TOP_LEVEL_KEY_RE = re.compile(r"^(?P<quote>[\\\"\\\']?)(?P<key>[A-Za-z_][A-Za-z0-9_-]*)(?P=quote)\\s*:", re.MULTILINE)',
          )

          # Liveness must exercise the verifier modes that previously had an
          # empty-match false-positive path, not only file-exists.
          old_selftest = '''elif python3 "$VERIFY" file-exists "$SKILL_DIR/SKILL.md" --kind file >/dev/null 2>&1; then
  echo "  [OK]   verify_claim.py self-test passed on installed SKILL.md"
else
  fail_required "verify_claim.py self-test failed"
fi
'''
          new_selftest = '''else
  python3 "$VERIFY" file-exists "$SKILL_DIR/SKILL.md" --kind file >/dev/null 2>&1
  EXISTS_CODE=$?
  python3 "$VERIFY" file-contains "$SKILL_DIR/SKILL.md" "anti-hallucination-protocol" >/dev/null 2>&1
  CONTAINS_CODE=$?
  python3 "$VERIFY" file-contains "$SKILL_DIR/SKILL.md" "" >/dev/null 2>&1
  EMPTY_CONTAINS_CODE=$?
  python3 "$VERIFY" file-line "$SKILL_DIR/SKILL.md" 1 "" >/dev/null 2>&1
  EMPTY_LINE_CODE=$?
  if [ "$EXISTS_CODE" -eq 0 ] && [ "$CONTAINS_CODE" -eq 0 ] && [ "$EMPTY_CONTAINS_CODE" -eq 2 ] && [ "$EMPTY_LINE_CODE" -eq 2 ]; then
    echo "  [OK]   verify_claim.py self-tests passed (existence, content, empty-match rejection)"
  else
    fail_required "verify_claim.py self-test failed (exists=$EXISTS_CODE contains=$CONTAINS_CODE empty_contains=$EMPTY_CONTAINS_CODE empty_line=$EMPTY_LINE_CODE)"
  fi
fi
'''
          replace_once('scripts/liveness_check.sh', old_selftest, new_selftest)

          # v5.4.1 regression additions.
          regressions = '''


def test_whitespace_literal_file_contains_is_error():
    with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8") as handle:
        handle.write("anything with spaces\\n")
        handle.flush()
        code, payload = run_verifier("file-contains", handle.name, "   ")
    assert code == 2
    assert payload["status"] == "ERROR"


def test_whitespace_file_line_expected_is_error():
    with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8") as handle:
        handle.write("anything\\n")
        handle.flush()
        code, payload = run_verifier("file-line", handle.name, "1", "   ")
    assert code == 2
    assert payload["status"] == "ERROR"


def test_whitespace_command_expected_is_error():
    code, payload = run_verifier(
        "command-output", "--expected", "   ", "--", sys.executable, "-c", "print('anything')"
    )
    assert code == 2
    assert payload["status"] == "ERROR"
'''
          p = Path('tests/test_v541_regressions.py')
          text = p.read_text(encoding='utf-8')
          if 'test_whitespace_literal_file_contains_is_error' not in text:
              p.write_text(text + regressions, encoding='utf-8')

          integrity_tests = '''


def test_quoted_duplicate_top_level_key_fails(tmp_path):
    fake = valid_skill().replace(
        "version: 5.4.1",
        'version: 5.4.1\\n"version": 5.4.2',
    )
    root = write_minimal_tree(tmp_path, fake)
    errors = mod.validate(root)
    assert any("duplicate top-level key: version" in e for e in errors)


def test_readme_requires_mandatory_startup_integration():
    readme = (ROOT / "README.md").read_text(encoding="utf-8")
    assert "### Mandatory startup integration" in readme
    assert 'skill_view(name="anti-hallucination-protocol")' in readme
    assert "installed but not active for startup" in readme
'''
          p = Path('tests/test_v5_integrity.py')
          text = p.read_text(encoding='utf-8')
          if 'test_quoted_duplicate_top_level_key_fails' not in text:
              p.write_text(text + integrity_tests, encoding='utf-8')

          liveness_tests = '''


def test_skill_path_with_spaces_passes(tmp_path: Path):
    skill = tmp_path / "skill with spaces"
    shutil.copytree(ROOT, skill)
    result = run_liveness(skill)
    assert result.returncode == 0, result.stdout + result.stderr


def test_corrupted_verifier_empty_match_selftest_is_nonzero(tmp_path: Path):
    skill = tmp_path / "skill"
    shutil.copytree(ROOT, skill)
    verifier = skill / "scripts" / "verify_claim.py"
    verifier.write_text("#!/usr/bin/env python3\\nraise SystemExit(0)\\n", encoding="utf-8")
    result = run_liveness(skill)
    assert result.returncode != 0
    assert "verify_claim.py self-test failed" in result.stdout


def test_multiple_required_failures_remain_nonzero(tmp_path: Path):
    skill = tmp_path / "skill"
    shutil.copytree(ROOT, skill)
    (skill / "scripts" / "verify_claim.py").unlink()
    (skill / "scripts" / "check_v5_integrity.py").unlink()
    result = run_liveness(skill)
    assert result.returncode != 0
    assert "verify_claim.py missing" in result.stdout
    assert "check_v5_integrity.py unavailable" in result.stdout
'''
          p = Path('tests/test_liveness.py')
          text = p.read_text(encoding='utf-8')
          if 'test_skill_path_with_spaces_passes' not in text:
              p.write_text(text + liveness_tests, encoding='utf-8')

          # Keep the provenance fixture aligned with the live title checked for
          # the current arXiv identity.
          replace_all(
              'tests/test_research_provenance.py',
              "Don't Ask the LLM to Track Freshness: A Deterministic Recipe for Memory Conflict Resolution - arXiv:2606.01435: https://arxiv.org/abs/2606.01435",
              "Reliable Post-Retrieval Assembly for Agent Memory: Separating Evidence Extraction from Policy Execution - arXiv:2606.01435: https://arxiv.org/abs/2606.01435",
          )

          # Schema metadata follows the patch release.
          replace_once(
              'references/evidence-record.schema.json',
              '"title": "Anti-Hallucination v5.4 Evidence Record"',
              '"title": "Anti-Hallucination v5.4.1 Evidence Record"',
          )
          PY

      - name: Run full regression gate
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check pytest pyyaml
          python3 -m pytest tests/ -v
          python3 scripts/check_v5_integrity.py --root .
          python3 scripts/check_research_provenance.py --root .
          AHP_SKILL_DIR="$(pwd)" bash scripts/liveness_check.sh
          python3 scripts/verify_claim.py file-contains README.md "" >/tmp/empty.json || test $? -eq 2
          python3 scripts/verify_claim.py file-line README.md 1 "" >/tmp/empty-line.json || test $? -eq 2

      - name: Commit verified patch to v5.4.1 branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config user.name "AHP hardening bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md scripts/ tests/ references/
          git diff --cached --check
          git commit -m "finalize v5.4.1 verifier and startup hardening"
          git push origin HEAD:v5.4.1-hardening
