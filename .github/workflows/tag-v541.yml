name: Tag v5.4.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/tag-v541.yml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and tag exact release
        run: |
          set -euxo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' SKILL.md | head -1)"
          test "$VERSION" = "5.4.1"
          python3 -m pip install --disable-pip-version-check pytest pyyaml
          python3 -m pytest tests/ -q
          python3 scripts/check_v5_integrity.py --root .
          python3 scripts/check_research_provenance.py --root .
          AHP_SKILL_DIR="$(pwd)" bash scripts/liveness_check.sh
          if git ls-remote --exit-code --tags origin refs/tags/v5.4.1 >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin refs/tags/v5.4.1 | awk '{print $1}')" = "$(git rev-parse HEAD)"
          else
            git tag v5.4.1 "$(git rev-parse HEAD)"
            git push origin refs/tags/v5.4.1
          fi
