name: Tag v5.4.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/tag-v5.4.2.yml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact release tag
        run: |
          set -euxo pipefail
          TARGET=94bfd13f9c4818a949775bd73c1c0d91ce6a3116
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v5.4.2 >/dev/null; then
            test "$(git rev-list -n1 v5.4.2)" = "$TARGET"
          else
            git tag v5.4.2 "$TARGET"
            git push origin refs/tags/v5.4.2
          fi
          test "$(git rev-list -n1 v5.4.2)" = "$TARGET"
