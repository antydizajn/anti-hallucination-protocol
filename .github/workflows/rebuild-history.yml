name: Rebuild AHP history

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Require cross-repo migration token
        env:
          AHP_HISTORY_PAT: ${{ secrets.AHP_HISTORY_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${AHP_HISTORY_PAT:-}" ]; then
            echo "ERROR: repository secret AHP_HISTORY_PAT is required." >&2
            echo "It must have read access to antydizajn/hermes-skills and write access to antydizajn/anti-hallucination-protocol." >&2
            exit 78
          fi

      - name: Install git-filter-repo
        run: python3 -m pip install --disable-pip-version-check git-filter-repo

      - name: Rebuild subtree history and verify final tree
        env:
          AHP_HISTORY_PAT: ${{ secrets.AHP_HISTORY_PAT }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          echo "workdir=$work"

          src="https://x-access-token:${AHP_HISTORY_PAT}@github.com/antydizajn/hermes-skills.git"
          dst="https://x-access-token:${AHP_HISTORY_PAT}@github.com/antydizajn/anti-hallucination-protocol.git"

          git clone "$src" "$work/source"
          git clone --branch main "$dst" "$work/current"

          echo "=== standalone-only commit candidates ==="
          mapfile -t extra_commits < <(
            git -C "$work/current" log --reverse --format='%H' -- \
              LICENSE \
              AUDITS/gpt-5.6-sol-v5.4-prompt-review.md
          )
          for commit in "${extra_commits[@]}"; do
            git -C "$work/current" show -s --format='%H %aI %an <%ae> %s' "$commit"
          done

          cd "$work/source"
          git filter-repo --force \
            --path software-development/anti-hallucination-protocol/ \
            --path-rename software-development/anti-hallucination-protocol/:

          echo "=== filtered history ==="
          git log --reverse --format='%H %aI %an <%ae> %s'

          root_commit="$(git rev-list --max-parents=0 HEAD)"
          first_version="$(git show "$root_commit":SKILL.md | sed -n 's/^version:[[:space:]]*//p' | head -1)"
          echo "root_commit=$root_commit"
          echo "first filtered version=$first_version"
          test "$first_version" = "2.0.0"

          git remote add current "$work/current"
          git fetch current main

          for commit in "${extra_commits[@]}"; do
            echo "cherry-picking standalone-only commit: $commit"
            git cherry-pick "$commit"
          done

          source_tree="$(git rev-parse HEAD^{tree})"
          current_tree="$(git -C "$work/current" rev-parse HEAD^{tree})"
          echo "rebuilt_source_tree=$source_tree"
          echo "standalone_main_tree=$current_tree"

          if [ "$source_tree" != "$current_tree" ]; then
            echo "ERROR: rebuilt history does not match current standalone main" >&2
            echo "=== file-level diff ===" >&2
            diff -qr --exclude=.git "$work/source" "$work/current" || true
            exit 42
          fi

          echo "Final trees are identical. Publishing candidate history branch only."
          git remote add standalone "$dst"
          git push --force standalone HEAD:refs/heads/history-rebuilt

          echo "history-rebuilt pushed successfully"
