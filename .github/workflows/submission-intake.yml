name: External submission intake

on:
  pull_request:
    paths:
      - 'SUBMISSIONS/**'
      - 'scripts/check_external_submission.py'
      - 'scripts/external_contributor.py'
      - 'EXTERNAL-CONTRIBUTOR.md'
      - 'CONTRIBUTING.md'
      - 'tests/test_project_infrastructure.py'
      - 'tests/test_agent_identity_secret_boundary.py'
      - 'tests/test_external_contributor.py'
      - '.github/workflows/submission-intake.yml'

permissions:
  contents: read

jobs:
  validate-submissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Validate external submission structure
        run: python3 scripts/check_external_submission.py --root SUBMISSIONS/INBOX

      - name: Run infrastructure regression tests
        run: >-
          python3 -m pytest
          tests/test_project_infrastructure.py
          tests/test_agent_identity_secret_boundary.py
          tests/test_external_contributor.py
          -q

      - name: Security boundary
        run: |
          echo 'External submission intake is non-executing by design.'
          echo 'Fork PR validation uses the unprivileged pull_request event.'
          echo 'No submitted scripts, binaries, reproducer commands, or report instructions are executed by this workflow.'
