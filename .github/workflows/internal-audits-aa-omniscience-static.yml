name: Internal audits AA Omniscience static integrity

on:
  pull_request:
    paths:
      - 'INTERNAL-AUDITS/**'
      - '.github/workflows/internal-audits-aa-omniscience-static.yml'

permissions:
  contents: read

jobs:
  aa-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install pyyaml
      - name: Validate benchmark static integrity
        run: python INTERNAL-AUDITS/RUNNERS/validate_benchmark.py
      - name: Validate AA source verifier syntax
        run: python -m py_compile INTERNAL-AUDITS/EXTERNAL-BATTERIES/AA-OMNISCIENCE-600/verify_source.py
      - name: Validate AA arm runner syntax
        run: python -m py_compile INTERNAL-AUDITS/EXTERNAL-BATTERIES/AA-OMNISCIENCE-600/run_aa_arm.py
